name: Renovate

on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:
    inputs:
      baseBranches:
        description: 'Target branch to scan (e.g., feature/copilot-bridge-streaming)'
        required: false
        default: 'main'
        type: string

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Self-hosted Renovate
        uses: renovatebot/github-action@v46.2.4
        with:
          configurationFile: renovate.json
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          LOG_LEVEL: 'info'
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_BASE_BRANCHES: ${{ inputs.baseBranches || 'main' }}

