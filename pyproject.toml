[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-cli"
version = "0.1.0"
description = "Browser probe, AI chat CLI, and Textual TUI for browser-discovered AI endpoints"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Victor Becerra" }
]
keywords = ["ai", "cli", "tui", "textual", "playwright", "browser-probe"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Utilities",
  "Topic :: Software Development :: User Interfaces"
]

dependencies = [
  "requests>=2.32.0",
  "typer>=0.12.3",
  "rich>=13.7.1"
]

[project.optional-dependencies]
tui = [
  "textual>=0.70.0"
]
probe = [
  "playwright>=1.45.0"
]
all = [
  "textual>=0.70.0",
  "playwright>=1.45.0"
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-requests>=2.32.0.20250515"
]

[project.scripts]
ai-cli = "ai_cli.cli:app"

[project.urls]
Homepage = "https://github.com/victorbecerragit/ai-cli"
Repository = "https://github.com/victorbecerragit/ai-cli"
Issues = "https://github.com/victorbecerragit/ai-cli/issues"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["ai_cli", "ai_cli.*"]

[tool.setuptools.package-data]
ai_cli = ["tui.tcss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=ai_cli --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
ignore_missing_imports = true
pretty = true
explicit_package_bases = true
mypy_path = ["src"]

[tool.coverage.run]
branch = true
source = ["ai_cli"]

[tool.coverage.report]
show_missing = true
skip_covered = false